name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: qmi8658c
            test_args: "--features fixed"
            check_args: "--features defmt,fixed"
          - name: legacy-c
            test_args: "--no-default-features"
            check_args: "--no-default-features"
          - name: qmi8658a
            test_args: "--no-default-features --features qmi8658a,fixed"
            check_args: "--no-default-features --features qmi8658a,defmt,fixed"
    name: lint-test (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test -p ph-qmi8658 ${{ matrix.test_args }}
      - name: Clippy
        run: cargo clippy -p ph-qmi8658 --all-targets ${{ matrix.check_args }} -- -D warnings

  variant-conflict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Mutually exclusive variants fail
        run: |
          if cargo check -p ph-qmi8658 --no-default-features --features qmi8658a,qmi8658c; then
            echo "expected mutually exclusive variant features to fail"
            exit 1
          fi

  build-xtensa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: esp-rs/xtensa-toolchain@v1.5
        with:
          default: true
          version: "latest"
          ldproxy: true
          buildtargets: "esp32,esp32s2,esp32s3"
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build xtensa targets
        run: |
          cargo +esp build -p ph-qmi8658 --target xtensa-esp32-none-elf -Zbuild-std=core --features defmt,fixed
          cargo +esp build -p ph-qmi8658 --target xtensa-esp32-none-elf -Zbuild-std=core --no-default-features --features qmi8658a,defmt,fixed
          cargo +esp build -p ph-qmi8658 --target xtensa-esp32s2-none-elf -Zbuild-std=core --features defmt,fixed
          cargo +esp build -p ph-qmi8658 --target xtensa-esp32s2-none-elf -Zbuild-std=core --no-default-features --features qmi8658a,defmt,fixed
          cargo +esp build -p ph-qmi8658 --target xtensa-esp32s3-none-elf -Zbuild-std=core --features defmt,fixed
          cargo +esp build -p ph-qmi8658 --target xtensa-esp32s3-none-elf -Zbuild-std=core --no-default-features --features qmi8658a,defmt,fixed
      - name: Build hardware QA runner
        working-directory: apps/qa-runner
        run: cargo +esp build
      - name: Build IMU example
        working-directory: apps/imu-example
        run: cargo +esp build

  build-cross:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - riscv32imc-unknown-none-elf
          - riscv32imac-unknown-none-elf
          - thumbv6m-none-eabi
          - thumbv7m-none-eabi
          - thumbv7em-none-eabi
          - thumbv7em-none-eabihf
          - thumbv8m.base-none-eabi
          - thumbv8m.main-none-eabi
          - thumbv8m.main-none-eabihf
        variant:
          - name: qmi8658c
            args: "--features defmt,fixed"
          - name: qmi8658a
            args: "--no-default-features --features qmi8658a,defmt,fixed"
    name: build-cross (${{ matrix.target }}, ${{ matrix.variant.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build -p ph-qmi8658 --target ${{ matrix.target }} ${{ matrix.variant.args }}

  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          manifest-path: crates/qmi8658/Cargo.toml

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (docs)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Build docs
        run: cargo doc --manifest-path Cargo.toml --no-deps --features defmt,fixed
        env:
          RUSTDOCFLAGS: -D warnings
